name: ChatGPT Vosk Assets

on:
  push:
    branches:
      - chatgpt-vosk-assets
    paths:
      - '.github/workflows/chatgpt-vosk-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Vosk Android runtime and Chinese model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          python3 - <<'PY'
          import urllib.request
          urls={
            'out/vosk-android-0.3.47.aar':'https://repo1.maven.org/maven2/com/alphacephei/vosk-android/0.3.47/vosk-android-0.3.47.aar',
            'out/jna-5.13.0.aar':'https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.aar',
            'out/vosk-model-small-cn-0.22.zip':'https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip',
          }
          for path,url in urls.items():
              req=urllib.request.Request(url,headers={'User-Agent':'Yuejing-Vosk-Builder'})
              with urllib.request.urlopen(req,timeout=120) as r, open(path,'wb') as f:
                  while True:
                      b=r.read(1024*1024)
                      if not b: break
                      f.write(b)
              print(path)
          PY
          ls -lh out
          sha256sum out/* | tee out/SHA256SUMS.txt

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: vosk-android-cn-assets
          path: out/*
          if-no-files-found: error
          compression-level: 0
